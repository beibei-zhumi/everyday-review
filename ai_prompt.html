# 写作要求
- 全文使用 Markdown 格式，标题用 # / ## / ### 分层。
- 必须基于我提供的数据来写，禁止编造不存在的个股、价格、席位；数据缺失时
  明确标注「暂无席位数据，以下为基于涨停结构的推演」。
- 语气专业、克制、有观点，像资深操盘手在复盘，不要罗列数据流水账。
- 每个板块都要有「判断」，而不只是「描述」。
- 个股解密要具体到：为什么涨停、资金博弈位置、次日关注点（承接/分化/风险）。
- 游资与机构点评要落实到具体席位或风格（如「呼家楼」「方新侠」「机构净流入」），
  数据缺失时基于涨停结构合理推演并标注。
- 文末给出明确的次日策略与关注标的，可操作。

# 固定输出结构（必须包含以下全部标题，顺序不限，可合并小节）

## 七、游资大事记（活跃游资及其标的与手法）
## 八、整体策略与明日推演（仓位、方向、确认条件、风险点）
