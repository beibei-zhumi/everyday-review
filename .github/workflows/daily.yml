name: Daily Review

# 两个 job：
#   1) daily    —— 每个交易日 15:40 跑完整复盘并发布整站到 gh-pages（含龙虎榜）。
#   2) intraday —— 盘中每 10 分钟跑一次 watch-slice，生成 intraday_runtime.json 并
#                 增量发布到 gh-pages，让「实时盯盘」标签页的六维温度/情绪分/盘中轨迹
#                 在盘中就有数据。数据源均为免费公开源（东方财富/腾讯），无需任何 token。
# 仓库根目录只需要两个文件：本文件(.github/workflows/daily.yml) + quant-review-src.txt(项目压缩包)。

on:
  schedule:
    # === daily job 触发：北京时间 15:40（收盘后 10 分钟），周一至周五 ===
    # === intraday job 触发：北京时间 09:30-11:30、13:00-15:00 每 10 分钟 ===
    # GitHub schedule cron 一律按 UTC，且不支持 timezone 字段：
    #   UTC 07:40 = 北京 15:40
    #   北京 09:30-11:30 = UTC 01:30-03:30 → UTC 1-3 时区每 10 分钟
    #   北京 13:00-15:00 = UTC 05:00-07:00 → UTC 5-7 时区每 10 分钟
    - cron: "40 7 * * 1-5"
    - cron: "*/10 1-3 * * 1-5"
    - cron: "*/10 5-7 * * 1-5"
  workflow_dispatch:
    inputs:
      date10:
        description: "指定交易日 YYYY-MM-DD，留空则自动判断"
        required: false
        default: ""
        type: string
      run_job:
        description: "手动触发时指定只跑哪个 job：daily=仅完整复盘，intraday=仅盘中切片，留空=两个都跑"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - daily
          - intraday

permissions:
  contents: write

concurrency:
  group: daily-review
  cancel-in-progress: false

env:
  QR_DATA_SOURCE: free
  TZ: Asia/Shanghai

jobs:
  daily:
    # 定时 cron 与手动(留空 run_job)都跑；手动指定 run_job=intraday 时跳过，避免误重跑完整复盘
    if: github.event.inputs.run_job != 'intraday'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解压源码（quant-review-src.txt 是 gzip 压缩包）
        run: |
          set -euo pipefail
          echo "=== 解压前根目录 ==="
          ls -la
          tar -xzf quant-review-src.txt
          echo "=== 解压后根目录 ==="
          ls -la
          echo "=== qr.sh 是否就位 ==="
          test -x ./qr.sh && echo "qr.sh OK" || echo "qr.sh 缺失"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web deps
        run: cd web && npm ci

      # 流水线依赖历史缓存计算 7 日趋势、连板高度趋势等指标。
      # 缓存目录被 .gitignore 忽略，不会进入仓库，只能靠 Actions 缓存在运行间传递。
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            cache_online
          key: qr-data-${{ github.run_id }}
          restore-keys: |
            qr-data-

      - name: Pre-fetch eastmoney tomorrow themes (今日题材预注入)
        # 用东方财富公开 API（免费、无需 token）预注入 eastmoney_tomorrow.json，
        # 使「今日题材」页能拿到开盘前快照，主题数量/首个主题与原设计对齐。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/fetch_eastmoney_tomorrow.py web/public/eastmoney_tomorrow.json \
            || echo "::warning title=明日主题预拉取失败::eastmoney tomorrow fetch failed, 前端将回退实时 API"

      - name: Collect xuangubao intraday resonance (free, 共振基线)
        # 免费公开接口（CORS 开放，无需 token）采集选股宝盘中异动，生成板块共振基线
        # intraday_resonance.json，让「实时盯盘」打开即见当日共振（无需付费 token 源）。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/collect_xuangubao_intraday.py \
            || echo "::warning title=共振基线采集失败::xuangubao resonance collect failed, 前端将仅在盘中实时弹出"

      - name: Run full pipeline
        env:
          QR_DATA_SOURCE: free
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          chmod +x ./qr.sh
          date10="${{ github.event.inputs.date10 || '' }}"
          if [ -n "${date10}" ]; then
            echo "指定交易日：${date10}"
            ./qr.sh fetch "${date10}"
          else
            echo "自动判断交易日"
            ./qr.sh fetch
          fi

      - name: Verify artifacts
        id: verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          dist = Path("web/dist")
          idx = dist / "index.html"
          if not idx.exists():
              sys.exit("未找到 web/dist/index.html")

          # 优先校验最终发布产物（web_bundle 产出的 market_data.json，字段最全），
          # 回退到按日命名的原始产物
          src = dist / "market_data.json"
          if not src.exists():
              files = sorted(dist.glob("market_data-*.json")) or sorted(Path("cache").glob("market_data-*.json"))
              if not files:
                  sys.exit("未找到任何 market_data，流水线可能未产出数据")
              src = files[-1]
          data = json.loads(src.read_text(encoding="utf-8"))

          required = ["ztgc", "plateRankTop10", "sectorHeatmap", "mood", "indices", "ladder"]
          missing = [k for k in required if not data.get(k)]
          if missing:
              sys.exit(f"关键字段缺失：{missing}")

          # 龙虎榜字段读取做容错：可能缺失/None/非 dict，绝不能让它把整个 run 拖红
          try:
              dt = data.get("dragonTiger")
              dt_items = dt.get("items") if isinstance(dt, dict) else []
              dt_count = len(dt_items) if isinstance(dt_items, list) else 0
          except Exception as exc:
              dt_count, dt_items = 0, []
              print(f"  (warn) dragonTiger 字段异常：{exc}")

          print(f"校验通过：{src.name}  数据日={data.get('date')}  字段数={len(data)}")
          print(f"  涨停={len(data.get('ztgc') or [])}  板块TOP={len(data.get('plateRankTop10') or [])}")
          print(f"  龙虎榜={dt_count} 只")
          with open("dist_date.txt", "w", encoding="utf-8") as fh:
              fh.write(str(data.get("date") or ""))
          PY

      - name: Bundle live page
        # 实时页是纯前端直连数据源的轻量页，一并放进发布目录：
        #   /          = 完整版（本流水线每日产出）
        #   /live.html = 实时版（打开即拉最新，盘中可用，不依赖本流水线）
        run: |
          if [ -f web/live/index.html ]; then
            cp web/live/index.html web/dist/live.html
            echo "已包含实时页 live.html"
          else
            echo "::warning title=Live page missing::web/live/index.html 不存在，跳过"
          fi

      - name: 导出 AI 提问 prompt（免费，无需 API key）
        # 把「原设计者复盘思路(SYSTEM_PROMPT) + 当日数据」合并导出为 ai_prompt.md / ai_prompt.html，
        # 随整站发布到 gh-pages。用户可打开页面一键复制，粘贴到任意 AI 自行提问（不消耗 token）。
        # 注意：web_bundle 只把数据内联进 HTML，不保证刷新 web/dist/market_data.json
        # （该文件可能残留旧日期），所以不能只认这一个文件。这里与 Verify 步骤一致，
        # 在所有候选里选「数据日(date)最新」的那份，确保导出的 prompt 是当日数据。
        continue-on-error: true
        run: |
          set -euo pipefail
          SRC=$(python3 - <<'PY'
          import glob, json
          cands = glob.glob("web/dist/market_data*.json") + glob.glob("cache/market_data-*.json")
          best, best_date = None, None
          for c in cands:
              try:
                  d = json.load(open(c, encoding="utf-8"))
                  dt = d.get("date") or ""
                  if best_date is None or dt > best_date:
                      best_date, best = dt, c
              except Exception:
                  pass
          if not best:
              raise SystemExit("未找到 market_data，跳过 prompt 导出")
          print(best)
          PY
          )
          python3 daily_review/ai/analyzer.py "$SRC" --export-prompt web/dist/ai_prompt \
            && echo "::notice title=AI 提问 prompt::已生成 ai_prompt.md（数据日 $(python3 -c "import json;print(json.load(open('$SRC',encoding='utf-8')).get('date'))")）" \
            || echo "::warning title=AI prompt 导出失败::analyzer export-prompt failed"

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd web/dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无内容变化，跳过提交"
            exit 0
          fi
          date_txt="$(cat ../../dist_date.txt 2>/dev/null || echo '')"
          git commit -q -m "daily review ${date_txt:-$(date +%F)}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "已发布到 gh-pages"

      - name: Summary
        if: always()
        # 注意：job.status 不能直接 inline 在 run 块里（GitHub Actions 模板解析会报
        # Unrecognized named-value）。必须先通过 env 传入，再在 shell 里用 $JOB_STATUS。
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          {
            echo "### 每日复盘发布结果"
            echo ""
            echo "- 触发方式：${EVENT_NAME}"
            echo "- 数据源：免费公开源（无需 token）"
            echo "- 状态：${JOB_STATUS:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

  # 盘中切片 job：每 10 分钟跑一次 watch-slice，生成 intraday_runtime.json 并增量发布到 gh-pages。
  # 独立于 daily job，即便 daily 当天未跑，盘中六维参考温度/情绪分/盘中轨迹仍可工作。
  intraday:
    # 定时 cron 与手动(留空 run_job)都跑；网页「刷新盘中」按钮发 run_job=intraday 只跑这个 job
    if: github.event.inputs.run_job != 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解压源码
        run: |
          set -euo pipefail
          tar -xzf quant-review-src.txt
          chmod +x ./qr.sh
          test -x ./qr.sh && echo "qr.sh OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore cache（保留跨次运行积累的盘中切片）
        uses: actions/cache@v4
        with:
          path: |
            cache
          key: intraday-${{ github.run_id }}
          restore-keys: |
            intraday-

      - name: Run watch-slice（生成实时盯盘切片 JSON）
        env:
          QR_DATA_SOURCE: free
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          date10="${{ github.event.inputs.date10 || '' }}"
          if [ -n "${date10}" ]; then
            echo "指定交易日：${date10}"
            DATE_ARG="${date10}" ./qr.sh watch-slice "${date10}"
          else
            ./qr.sh watch-slice
          fi

      - name: Collect xuangubao intraday resonance (free, 盘中增量)
        # 盘中每 10 分钟顺带采集选股宝异动、刷新板块共振基线，随盘中切片一起发布。
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/collect_xuangubao_intraday.py \
            || echo "::warning title=共振基线采集失败::xuangubao resonance collect failed"

          echo "=== 检查产物 ==="
          if [ -f web/public/intraday_runtime.json ]; then
            python3 - <<'PY'
          import json
          p = "web/public/intraday_runtime.json"
          d = json.load(open(p, encoding="utf-8"))
          print(f"intraday_runtime.json  date={d.get('date')!r}  snapshots={len(d.get('snapshots') or [])}  updated_at={d.get('updated_at')!r}")
          latest = d.get("latest") or {}
          print(f"latest.zt={latest.get('zt')}  max_lb={latest.get('max_lb')}  heat={latest.get('heat')}  risk={latest.get('risk')}  shift_score={latest.get('shift_score')}")
          PY
          else
            echo "::error title=Intraday runtime missing::盘中切片产出失败，web/public/intraday_runtime.json 未生成"
            exit 1
          fi

      - name: Deploy intraday runtime to gh-pages（增量，不覆盖整站）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f web/public/intraday_runtime.json ]; then
            echo "no runtime to publish"; exit 0
          fi
          tmp="$(mktemp -d -t intraday_pub.XXXXXX)"
          cd "${tmp}"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 拉取远端 gh-pages（如有），基于其上追加/覆盖实时文件，避免覆盖整站其他内容
          git fetch --depth=1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages || true
          if git checkout -q FETCH_HEAD 2>/dev/null; then
            echo "基于现有 gh-pages 增量更新"
          else
            echo "gh-pages 尚不存在，初始化空仓库"
          fi
          mkdir -p cache
          cp -f "${GITHUB_WORKSPACE}/web/public/intraday_runtime.json" intraday_runtime.json
          cp -f "${GITHUB_WORKSPACE}/cache/"intraday_slices-*.json cache/ 2>/dev/null || true
          # 板块共振基线（免费选股宝采集），与盘中切片一并增量发布
          if [ -f "${GITHUB_WORKSPACE}/web/public/intraday_resonance.json" ]; then
            cp -f "${GITHUB_WORKSPACE}/web/public/intraday_resonance.json" intraday_resonance.json
          fi
          # 选股宝实时热点板块（并入盘后「今日题材」视图，保证题材数不比盘中少）
          if [ -f "${GITHUB_WORKSPACE}/web/public/xuangubao_plates.json" ]; then
            cp -f "${GITHUB_WORKSPACE}/web/public/xuangubao_plates.json" xuangubao_plates.json
          fi
          git add intraday_runtime.json cache/intraday_slices-*.json intraday_resonance.json xuangubao_plates.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无盘中数据变化，跳过发布"
          else
            git commit -q -m "intraday runtime $(date '+%F %T')"
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
            echo "已增量发布 intraday_runtime.json 到 gh-pages"
          fi

      - name: Summary
        if: always()
        # 同样：job.status 不能直接 inline 在 run 块里，用 env 传入。
        env:
          JOB_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -e
          {
            echo "### 盘中切片发布结果"
            echo ""
            echo "- 触发方式：${EVENT_NAME}（cron 每 10 分钟 / 手动）"
            echo "- 数据源：免费公开源（东方财富/腾讯，无需 token）"
            echo "- 状态：${JOB_STATUS:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
